name: Updating U.S. map
'on':
  push:
    branches:
      - main
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch: null
jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          packages: |
            any::httr
            any::jsonlite
            any::dplyr 
            any::tibble
            any::lubridate
            any::dotenv
      
      - name: Set up environment variables
        run: |
          echo "DW_API_KEY=${{ secrets.DATAWRAPPR }}" >> $GITHUB_ENV
          echo "POWEROUTAGE_API_KEY=${{ secrets.POWEROUTAGE_API_KEY }}" >> $GITHUB_ENV
      
      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"
      - name: Run get-API-data script
        run: Rscript -e 'source("get-API-data.R")'
