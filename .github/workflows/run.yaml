name: run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *" # Runs every 30 minutes
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            dplyr
            janitor
            tidyr
            lubridate
            dotenv
            aws.s3

      - name: Set up AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> $GITHUB_ENV

      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"

      - name: Check if get-s3-data.R exists
        run: |
          if [ -f get-s3-data.R ]; then
            echo "File exists."
          else
            echo "File does not exist."
            exit 1
          fi

      - name: Run get-s3-data.R script
        run: Rscript -e 'tryCatch({ source("get-s3-data.R") }, error = function(e) { cat("Error in get-s3-data.R:", e$message, "\n") })'

      - name: Run viz.R script
        run: Rscript -e 'tryCatch({ source("viz.R") }, error = function(e) { cat("Error in viz.R:", e$message, "\n") })'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add get-s3-data.R
          git commit -m 'ran get-s3-data.R' || echo "No changes to commit"
          git push origin || echo "No changes to commit"