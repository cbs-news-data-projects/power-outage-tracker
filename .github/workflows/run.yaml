name: run

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *" # Runs every 30 minutes
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr 
            any::janitor
            any::tidyr
            any::lubridate
            any::dotenv
            any::aws.s3

      - name: Set up environment variables based on DATAWRAPPR secret
        run: echo "DW_API_KEY=${{ secrets.DATAWRAPPR }}" >> $GITHUB_ENV
        
      - name: Set up AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}" >> $GITHUB_ENV

      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest CSV file from S3
        run: |
          echo "Downloading latest CSV file from S3..."
          Rscript -e "
          library(aws.s3)
          library(lubridate)

          bucket <- 'fe-outge' # Replace with your bucket name
          state_folder <- 'your/state/folder' # Replace with your specific state folder
          today <- Sys.Date()
          time_format <- '%Y-%m-%d %H:%M:%S'

          # List all objects in the specified S3 folder
          objects <- get_bucket(bucket = bucket, prefix = state_folder)

          # Filter for today's CSV files
          today_files <- objects[grepl(paste0(today), objects$LastModified),]
          csv_files <- today_files[grepl('\\.csv$', today_files$Key),]

          # Check if there are any CSV files
          if (nrow(csv_files) > 0) {
            # Get the latest CSV file by LastModified
            latest_file <- csv_files[which.max(as.POSIXct(csv_files$LastModified, format = time_format)),]

            # Download the latest file
            save_object(latest_file$Key, file = file.path('data', latest_file$Key))
            message('Downloaded: ', latest_file$Key)
          } else {
            stop('No CSV files found for today.')
          }
          "

      - name: Run get-s3-data script
        run: Rscript -e 'source("get-s3-data.R")'

      - name: Run visualization script
        run: Rscript -e 'source("viz.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add get-s3-data.R
          git commit -m 'ran get-s3-data.R' || echo "No changes to commit"
          git push origin || echo "No changes to commit"